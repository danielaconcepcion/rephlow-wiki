<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Comparison of a conventional alginate bead, with bacteria dispersed throughout the matrix, and the core-shell architecture selected for RePhlow, with bacteria confined to a liquid core surrounded by a solid shell">
  <title>Conventional alginate bead compared with the RePhlow core-shell capsule</title>
  <defs>
    <pattern id="ec-hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#1B2340" stroke-width="1.1" opacity="0.4" />
    </pattern>
    <pattern id="ec-hatch-2" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#1B2340" stroke-width="1.1" opacity="0.28" />
    </pattern>

    <clipPath id="ec-clip-bead">
      <circle cx="190" cy="140" r="112" />
    </clipPath>
    <clipPath id="ec-clip-shell">
      <path fill-rule="evenodd" clip-rule="evenodd" d="
        M 670,28 A 112,112 0 1,0 670,252 A 112,112 0 1,0 670,28 Z
        M 670,64 A 76,76 0 1,1 670,216 A 76,76 0 1,1 670,64 Z
      " />
    </clipPath>

    <g id="ec-bacterium">
      <rect x="-15" y="-6.5" width="30" height="13" rx="6.5" ry="6.5" />
    </g>
  </defs>

  <style>
    .ec-label { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #4A5170; }
    .ec-vs { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-style: italic; fill: #4A5170; }
    .ec-bacterium { fill: #61A65B; }
    .ec-outline { fill: none; stroke: #4A5170; stroke-width: 1.5; }
  </style>

  <!-- Left: conventional bead — bacteria dispersed throughout a single alginate phase -->
  <g>
    <circle cx="190" cy="140" r="112" fill="#3B6FA0" fill-opacity="0.55" />
    <rect x="78" y="28" width="224" height="224" fill="url(#ec-hatch)" clip-path="url(#ec-clip-bead)" />
    <rect x="78" y="28" width="224" height="224" fill="url(#ec-hatch-2)" clip-path="url(#ec-clip-bead)" />
    <circle class="ec-outline" cx="190" cy="140" r="112" />

    <use href="#ec-bacterium" class="ec-bacterium" transform="translate(150,95) rotate(-12) scale(1.05)" />
    <use href="#ec-bacterium" class="ec-bacterium" transform="translate(232,108) rotate(20) scale(0.95)" />
    <use href="#ec-bacterium" class="ec-bacterium" transform="translate(150,178) rotate(35) scale(1.0)" />
    <use href="#ec-bacterium" class="ec-bacterium" transform="translate(222,188) rotate(-25) scale(0.85)" />
    <use href="#ec-bacterium" class="ec-bacterium" transform="translate(196,140) rotate(8) scale(0.8)" />
  </g>

  <!-- Comparison mark -->
  <text class="ec-vs" x="430" y="150" font-size="30" text-anchor="middle">vs</text>

  <!-- Right: core-shell capsule — bacteria confined to a liquid core inside a solid shell -->
  <g>
    <circle cx="670" cy="140" r="76" fill="#3B6FA0" fill-opacity="0.14" />
    <circle cx="670" cy="140" r="112" fill="none" />
    <rect x="558" y="28" width="224" height="224" fill="#3B6FA0" fill-opacity="0.55" clip-path="url(#ec-clip-shell)" />
    <rect x="558" y="28" width="224" height="224" fill="url(#ec-hatch)" clip-path="url(#ec-clip-shell)" />
    <rect x="558" y="28" width="224" height="224" fill="url(#ec-hatch-2)" clip-path="url(#ec-clip-shell)" />
    <circle class="ec-outline" cx="670" cy="140" r="112" />
    <circle class="ec-outline" cx="670" cy="140" r="76" stroke-width="1.3" opacity="0.8" />

    <use href="#ec-bacterium" class="ec-bacterium" transform="translate(645,115) rotate(-10) scale(1.05)" />
    <use href="#ec-bacterium" class="ec-bacterium" transform="translate(700,128) rotate(18) scale(0.9)" />
    <use href="#ec-bacterium" class="ec-bacterium" transform="translate(665,172) rotate(30) scale(0.95)" />
  </g>

  <!-- Captions -->
  <text class="ec-label" x="190" y="300" font-size="16" text-anchor="middle">Conventional bead</text>
  <text class="ec-label" x="190" y="320" font-size="12.5" text-anchor="middle" opacity="0.85">bacteria dispersed throughout the matrix</text>

  <text class="ec-label" x="670" y="300" font-size="16" text-anchor="middle">Core–shell capsule</text>
  <text class="ec-label" x="670" y="320" font-size="12.5" text-anchor="middle" opacity="0.85">bacteria confined to a liquid core</text>
</svg>
