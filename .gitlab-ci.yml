image: node:22

variables:
  # The wiki previously contained large generated scenario exports. They are
  # now served from static.igem.wiki, so CI only needs the current tree and
  # should not download their blobs from recent history.
  GIT_DEPTH: "1"

pages:
  stage: build
  before_script:
    # node:22 already provides Yarn's package cache. Keeping a second offline
    # mirror duplicated every dependency and exhausted the runner's disk.
    - yarn install --frozen-lockfile --prefer-offline
  script:
    - yarn build
    - cp -a dist/. public/
    - echo '/* /index.html 200' > public/_redirects
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never # No runners will run on branches other than main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
