<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Functionalised rePhlow sphere</title>
  <desc id="desc">Organophosphates from degumming effluent are hydrolysed by surface-immobilised phosphohydrolases. Released orthophosphate diffuses into the alginate core and is stored as polyphosphate by engineered PAO.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#34495e"/>
    </marker>
    <pattern id="alginate" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M4 20C9 5 25 5 32 18S24 36 11 31" fill="none" stroke="#8fb9c9" stroke-width="1.1" opacity=".34"/>
      <circle cx="5" cy="20" r="2" fill="#79aabd" opacity=".42"/>
      <circle cx="32" cy="18" r="2" fill="#79aabd" opacity=".42"/>
    </pattern>
    <style>
      .label{font:500 19px Arial,sans-serif;fill:#253746}.small{font:400 16px Arial,sans-serif;fill:#50616f}.leader{fill:none;stroke:#6b7b87;stroke-width:1.5}.flow{fill:none;stroke:#34495e;stroke-width:2.2;marker-end:url(#arrow)}.thin{fill:none;stroke:#34495e;stroke-width:1.6}.p{fill:#d8a52b;stroke:#8b6817;stroke-width:1.4}.enzyme{fill:#8b77a9;stroke:#514267;stroke-width:1.8}.cell{fill:#b9cfaa;stroke:#4d714b;stroke-width:2}.dna{fill:none;stroke:#73906e;stroke-width:1.5;opacity:.8}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- Core-shell particle -->
  <circle cx="735" cy="385" r="300" fill="#edf5f7" stroke="#29485d" stroke-width="2.5"/>
  <circle cx="735" cy="385" r="267" fill="url(#alginate)" stroke="#70a0b3" stroke-width="2"/>
  <circle cx="735" cy="385" r="225" fill="#f7fbf9" stroke="#70a0b3" stroke-width="2"/>

  <!-- Immobilised enzymes anchored at the surface -->
  <g>
    <path class="thin" d="M494 207l-24-18"/><path class="enzyme" d="M455 171c-16-8-32 7-25 22-17 3-18 27-1 31-4 18 20 26 30 12 12 13 34 1 29-16 16-7 11-32-7-31 1-17-16-27-26-18Z"/>
    <path class="thin" d="M452 308l-28-8"/><path class="enzyme" d="M402 279c-17-4-29 14-18 27-15 8-8 31 9 29 3 18 29 18 34 1 15 9 32-8 21-23 13-12 0-34-17-28-5-16-24-21-29-6Z"/>
    <path class="thin" d="M440 429l-29 4"/><path class="enzyme" d="M386 413c-17 3-21 24-7 33-11 14 5 34 21 26 9 15 34 7 33-11 18 2 26-22 11-31 7-16-13-31-26-19-11-13-31-7-32 2Z"/>
    <path class="thin" d="M478 548l-25 15"/><path class="enzyme" d="M425 548c-15 9-10 30 7 33-5 16 15 30 28 18 14 11 34-5 27-21 17-5 16-31-1-35 1-18-24-26-34-12-15-8-31 1-27 17Z"/>
  </g>

  <!-- Organic substrates outside -->
  <g class="thin">
    <path d="M105 187h105l25 18h63"/><circle cx="105" cy="187" r="8" fill="#c5d0d8"/><circle cx="142" cy="187" r="8" fill="#c5d0d8"/><circle cx="179" cy="187" r="8" fill="#c5d0d8"/><circle class="p" cx="235" cy="205" r="10"/>
    <path d="M88 326h122l25 17h55"/><circle cx="88" cy="326" r="8" fill="#c5d0d8"/><circle cx="125" cy="326" r="8" fill="#c5d0d8"/><circle cx="162" cy="326" r="8" fill="#c5d0d8"/><circle class="p" cx="235" cy="343" r="10"/>
    <path d="M112 482h98l25 18h64"/><circle cx="112" cy="482" r="8" fill="#c5d0d8"/><circle cx="149" cy="482" r="8" fill="#c5d0d8"/><circle cx="186" cy="482" r="8" fill="#c5d0d8"/><circle class="p" cx="235" cy="500" r="10"/>
  </g>

  <!-- Substrate delivery and inward phosphate flux -->
  <path class="flow" d="M304 205C355 205 386 194 426 194"/>
  <path class="flow" d="M297 343C340 343 360 325 385 311"/>
  <path class="flow" d="M304 500C347 494 367 467 385 447"/>
  <g>
    <circle class="p" cx="485" cy="250" r="8"/><circle class="p" cx="520" cy="280" r="8"/><circle class="p" cx="562" cy="311" r="8"/>
    <circle class="p" cx="475" cy="375" r="8"/><circle class="p" cx="520" cy="388" r="8"/><circle class="p" cx="568" cy="396" r="8"/>
    <circle class="p" cx="493" cy="499" r="8"/><circle class="p" cx="535" cy="473" r="8"/><circle class="p" cx="576" cy="452" r="8"/>
  </g>
  <path class="flow" d="M456 224C493 251 526 282 555 306"/>
  <path class="flow" d="M449 350C490 372 528 385 560 393"/>
  <path class="flow" d="M457 526C500 492 536 468 570 452"/>

  <!-- Engineered PAO cells -->
  <g transform="translate(690 260) rotate(-16)">
    <rect class="cell" x="-80" y="-39" width="160" height="78" rx="39"/><path class="dna" d="M-55 5c15-28 32 28 48 0s33 28 48 0"/>
    <g transform="translate(26 -13)"><circle class="p" cx="0" cy="0" r="7"/><circle class="p" cx="17" cy="0" r="7"/><circle class="p" cx="34" cy="0" r="7"/></g>
  </g>
  <g transform="translate(825 414) rotate(12)">
    <rect class="cell" x="-86" y="-42" width="172" height="84" rx="42"/><path class="dna" d="M-59 8c16-28 33 28 50 0s34 28 50 0"/>
    <g transform="translate(24 -15)"><circle class="p" cx="0" cy="0" r="7"/><circle class="p" cx="17" cy="0" r="7"/><circle class="p" cx="34" cy="0" r="7"/><circle class="p" cx="51" cy="0" r="7"/></g>
  </g>
  <g transform="translate(670 527) rotate(17)">
    <rect class="cell" x="-72" y="-35" width="144" height="70" rx="35"/><path class="dna" d="M-49 7c14-24 29 24 43 0s29 24 43 0"/>
    <g transform="translate(20 -12)"><circle class="p" cx="0" cy="0" r="6"/><circle class="p" cx="15" cy="0" r="6"/><circle class="p" cx="30" cy="0" r="6"/></g>
  </g>
  <path class="flow" d="M575 311C610 302 625 290 641 279"/>
  <path class="flow" d="M575 396C648 398 699 404 738 410"/>
  <path class="flow" d="M575 452C602 478 615 494 625 505"/>

  <!-- Editorial labels. Leaders remain in the margins and terminate on the named element. -->
  <text class="label" x="70" y="108">Degumming effluent</text>
  <text class="small" x="70" y="133">organophosphate substrates</text>
  <path class="leader" d="M264 128H225L179 187"/>
  <circle cx="179" cy="187" r="3.2" fill="#6b7b87"/>

  <text class="label" x="72" y="614">Immobilised phosphohydrolases</text>
  <text class="small" x="72" y="639">surface hydrolysis</text>
  <path class="leader" d="M331 609H380L438 566"/>
  <circle cx="438" cy="566" r="3.2" fill="#6b7b87"/>

  <text class="label" x="975" y="112">Alginate shell</text>
  <path class="leader" d="M968 106H938L915 151"/>
  <circle cx="915" cy="151" r="3.2" fill="#6b7b87"/>

  <text class="label" x="383" y="682">Orthophosphate</text>
  <text class="small" x="383" y="707">diffusion towards the core</text>
  <path class="leader" d="M510 660V616L535 473"/>
  <circle cx="535" cy="473" r="3.2" fill="#6b7b87"/>

  <text class="label" x="959" y="565">Engineered PAO</text>
  <text class="small" x="959" y="590">intracellular polyP storage</text>
  <path class="leader" d="M950 558H923L878 432"/>
  <circle cx="878" cy="432" r="3.2" fill="#6b7b87"/>

  <!-- Minimal key for phosphorus forms -->
  <g transform="translate(70 690)"><circle class="p" cx="8" cy="-5" r="7"/><text class="small" x="24" y="0">phosphorus-containing species</text></g>
</svg>
